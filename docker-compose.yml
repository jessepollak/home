# Local PostgreSQL for money-action persistence during development.
# Start with `bun run db:up`, stop with `bun run db:down` (keeps the data
# volume). Run `docker compose down -v` explicitly if you want to erase it.
#
# The credentials below are deterministic local-development defaults, not
# secrets; nothing here is used by hosted/Neon or Vercel deployments. The port
# is bound to loopback only so the database is never exposed on the network.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: home
      POSTGRES_USER: home
      POSTGRES_PASSWORD: home
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - home-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home -d home"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  home-postgres-data:
