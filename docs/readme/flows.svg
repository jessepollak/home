<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1010" viewBox="0 0 1300 1010" role="img" aria-labelledby="flows-title flows-desc">
  <title id="flows-title">Home money flow mockups</title>
  <desc id="flows-desc">Illustrative mobile mockups of the current Send amount sheet, Activity history, and the bounded USDC against cbBTC Borrow market. All values and addresses are invented.</desc>
