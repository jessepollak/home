    <g id="pig-icon"><path class="icon" d="M4 10c0-3 2.7-5 6.5-5h2.2l2-1v2.1c1 .6 1.7 1.5 2 2.6H19v4h-2.3a6.7 6.7 0 0 1-2.2 2.4V18h-3v-2H7v2H4v-3.2A5.7 5.7 0 0 1 4 10Z"/><circle cx="13.5" cy="8.5" r=".8" fill="currentColor"/></g>
