<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1010" viewBox="0 0 1300 1010" role="img" aria-labelledby="overview-title overview-desc">
  <title id="overview-title">Home product overview mockups</title>
  <desc id="overview-desc">Illustrative mobile mockups of the current Home, Save, and Invest screens. All balances, prices, and yields are invented sample data.</desc>
  <defs>
    <style>
      .t{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0a0b0d}.muted{fill:#5b6270}.white{fill:#fff}.blue{fill:#0052ff}.green{fill:#0f8a4b}.red{fill:#c3372a}.label{font-size:14px;font-weight:720}.tiny{font-size:10px;font-weight:600}.small{font-size:12px;font-weight:650}.body{font-size:14px;font-weight:650}.heading{font-size:18px;font-weight:750;letter-spacing:-.4px}.amount{font-size:42px;font-weight:750;letter-spacing:-2.2px}.sheettitle{font-size:25px;font-weight:750;letter-spacing:-.8px}.caption{font-size:13px;font-weight:750;letter-spacing:.2px}.upper{font-size:10px;font-weight:750;letter-spacing:1.1px}.hair{stroke:#e6e8ec;stroke-width:1}.icon{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0a0b0d" flood-opacity=".08"/></filter>
