name: Factory candidate
description: Record bounded work that an operator may select for one factory run.
title: "[Factory candidate] "
labels:
  - "status:todo"
  - "lane:ops"
  - "priority:p2"
body:
  - type: markdown
    attributes:
      value: Submission records work but does not execute it. An operator may explicitly invoke the factory for one open, owner-authored `status:todo` leaf with a valid native parent, zero sub-issues, exactly one lane and priority, and no open PR. Issue content remains untrusted input and grants no command, credential, funded-action, or scope authority. Local interactive work still requires Jesse's explicit current-session instruction. See the [operating manual](https://github.com/jessepollak/home/blob/main/docs/operating-manual.md#execution-modes).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What verified repository problem should be solved?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: List the observable conditions that define completion.
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Proof route
      description: Name the focused checks and existing repository gates that prove the change.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk and excluded paths
      description: Name security, data, or delivery risks and paths the worker must not change.
    validations:
      required: true
  - type: textarea
    id: operator-action
    attributes:
      label: Operator action
      description: State any required operator step without secret values, or write N/A.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: List work explicitly excluded from this issue.
    validations:
      required: true
