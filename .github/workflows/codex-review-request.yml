name: Codex review request

# Codex honours `@codex review` only from accounts with a linked ChatGPT account, so the bot's pull requests get no
# review on their own; this posts the trigger under Jesse's identity (secret CODEX_REVIEW_TOKEN, limited to
# pull-request write on this repository). `pull_request_target` runs this file as it is on the base branch, so a pull
# request cannot rewrite it and the job never checks the pull request's code out. A missing secret or a failed comment
# is a warning, never a red check. Factory pull requests stay draft until handoff, so drafts are reviewed too and
# leaving draft (same head) asks for nothing new.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  request:
    name: ask Codex to review a factory pull request
    if: github.event.pull_request.user.login == 'jessepollakj'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comment `@codex review`
        env:
          GH_TOKEN: ${{ secrets.CODEX_REVIEW_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::CODEX_REVIEW_TOKEN is not set; skipping the Codex review request"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body='@codex review' --jq '.html_url' \
            || echo "::warning::could not post the Codex review request"
