name: PR destination

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - labeled
      - unlabeled
      - converted_to_draft
      - ready_for_review

concurrency:
  group: pr-destination-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# This privileged event checks out trusted main only. Its sole write permission
# publishes a commit status on the refetched live PR head; it never executes PR code.
permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  destination:
    name: Publish current-head PR destination status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted destination policy from main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/delivery

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Validate live destination and publish exact-head status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/delivery/publish-pr-destination-status.mjs
