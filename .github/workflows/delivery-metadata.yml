name: Delivery metadata

on:
  issues:
    types: [closed]
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - labeled
      - unlabeled
      - converted_to_draft
      - ready_for_review
      - closed

concurrency:
  group: delivery-metadata-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

# issues:write is required to delete labels; the trusted script limits its use
# to status:* on the event record. It never executes pull request code.
permissions:
  contents: read
  issues: write

jobs:
  clean-status-labels:
    name: Clean delivery status labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted metadata policy from main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/delivery

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Remove invalid or closed status labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/delivery/cleanup-status-labels.mjs
