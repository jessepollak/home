name: Storybook review links

on:
  deployment_status:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

concurrency:
  group: storybook-review-links-${{ github.event.pull_request.number || github.event.deployment.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  update:
    name: Update Storybook review links
    if: github.event_name == 'pull_request_target' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview – home-storybook')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      deployments: read
    steps:
      - name: Checkout default branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Update matching pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request_target" ]; then
            if ! bun run --cwd apps/web review:links "$PR_NUMBER" --write --repo "$GITHUB_REPOSITORY"; then
              echo "::warning::Could not update Storybook review links for pull request #${PR_NUMBER}"
            fi
            exit 0
          fi

          if ! prs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEPLOY_SHA}/pulls" --paginate --jq '.[] | select(.state == "open") | .number'); then
            echo "::warning::Could not list pull requests for the Storybook deployment"
            exit 0
          fi
          while IFS= read -r pr; do
            [ -n "$pr" ] || continue
            if ! bun run --cwd apps/web review:links "$pr" --write --repo "$GITHUB_REPOSITORY" --sha "$DEPLOY_SHA"; then
              echo "::warning::Could not update Storybook review links for pull request #${pr}"
            fi
          done <<< "$prs"
