name: Production warm navigation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-navigation:
    name: Chromium production warm navigation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.run_id }}
      cancel-in-progress: false
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DISABLE_CDP_USAGE_TRACKING: "true"
      DISABLE_CDP_ERROR_REPORTING: "true"
      CDP_SQL_AUTH_MODE: client-api-key
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bun run --cwd apps/web test:browser-install

      - name: Build and test production warm navigation
        shell: bash
        run: |
          started=$SECONDS
          set +e
          bun run --cwd apps/web test:browser-production-navigation
          status=$?
          elapsed=$((SECONDS - started))
          {
            echo "## Production warm navigation"
            echo "Build + next start + Playwright wall time: ${elapsed}s."
            echo "Exit status: ${status} (nonzero fails this workflow)."
            echo "Request counts and test results: production-navigation-results artifact."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload production navigation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-navigation-results
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
