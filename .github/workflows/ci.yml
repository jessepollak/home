name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: bun check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Non-secret defaults from .env.example. Browsing and the production
      # build work without CDP keys; live probes stay opt-in and are not set.
      DISABLE_CDP_USAGE_TRACKING: "true"
      DISABLE_CDP_ERROR_REPORTING: "true"
      CDP_SQL_AUTH_MODE: client-api-key
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verification evidence
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: node scripts/gates/verification-evidence.mjs

      - name: Playwright rung
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/gates/playwright-rung.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Failure cases
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/gates/failure-cases.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"


      - name: Check
        run: bun check

      - name: Unit-test runtime
        if: ${{ !cancelled() && (success() || hashFiles('apps/web/unit-test-results/junit.xml') != '') }}
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/gates/test-runtime.mjs --summary-json apps/web/unit-test-results/runtime.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload unit-test timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-timings
          path: apps/web/unit-test-results
          retention-days: 30
          if-no-files-found: ignore

      - name: Dead code (knip)
        run: bun run --cwd apps/web knip

      - name: Code Connect templates
        # Parses every *.figma.ts template offline; no Figma token is needed.
        run: bun run --cwd apps/web figma:connect:parse

      - name: Build Storybook
        run: bun run --cwd apps/web build-storybook

  # Main-only Figma sync. Both jobs skip their steps when the
  # FIGMA_ACCESS_TOKEN secret is absent, so the workflow never fails for lack
  # of it. Scopes: code_connect:write (publish), file_variables:read and
  # file_variables:write (variables). See docs/design-explorations/figma-workflow.md.
  publish-code-connect:
    name: publish Code Connect
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
    steps:
      - name: Skip without FIGMA_ACCESS_TOKEN
        if: env.FIGMA_ACCESS_TOKEN == ''
        run: echo "FIGMA_ACCESS_TOKEN is not set; skipping Code Connect publish."

      - name: Checkout
        if: env.FIGMA_ACCESS_TOKEN != ''
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        if: env.FIGMA_ACCESS_TOKEN != ''
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Setup Bun
        if: env.FIGMA_ACCESS_TOKEN != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install
        if: env.FIGMA_ACCESS_TOKEN != ''
        run: bun install --frozen-lockfile

      - name: Publish Code Connect
        if: env.FIGMA_ACCESS_TOKEN != ''
        run: bun run --cwd apps/web figma:connect:publish

  sync-figma-variables:
    name: sync Figma variables
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
    steps:
      - name: Skip without FIGMA_ACCESS_TOKEN
        if: env.FIGMA_ACCESS_TOKEN == ''
        run: echo "FIGMA_ACCESS_TOKEN is not set; skipping the Figma variables sync."

      - name: Checkout
        if: env.FIGMA_ACCESS_TOKEN != ''
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        if: env.FIGMA_ACCESS_TOKEN != ''
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Sync globals.css tokens to Figma variables
        if: env.FIGMA_ACCESS_TOKEN != ''
        run: node apps/web/scripts/figma-variables.mjs

  story-tests:
    name: story tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Chromium
        # Uses the pinned @playwright/test CLI so the vitest browser provider
        # finds the same browser build as the smoke suite.
        run: bun run --cwd apps/web test:browser-install

      - name: Test stories
        run: bun run --cwd apps/web test:stories

  exploration-story-tests:
    name: exploration story tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bun run --cwd apps/web test:browser-install

      - name: Test exploration stories
        run: bun run --cwd apps/web test:stories:explorations

  browser-smoke:
    name: Chromium smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISABLE_CDP_USAGE_TRACKING: "true"
      DISABLE_CDP_ERROR_REPORTING: "true"
      CDP_SQL_AUTH_MODE: client-api-key
      HOME_PLAYWRIGHT_ACCESS_CREDENTIAL: chromium-smoke-access-credential-fixture
      HOME_PLAYWRIGHT_ACCESS_SIGNING_SECRET: chromium-smoke-signing-secret-fixture
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Chromium
        # Uses the pinned @playwright/test CLI; bare `bunx playwright` downloads the latest CLI and mismatched browser builds.
        run: bun run --cwd apps/web test:browser-install

      - name: Test Chromium smoke
        run: bun run --cwd apps/web test:browser-smoke

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-smoke-results
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  performance:
    name: performance budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bun run --cwd apps/web test:browser-install

      - name: Build production fixture
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          HOME_PLAYWRIGHT_SMOKE: "1"
          HOME_OPERATOR_ADDRESSES: 0x1111111111111111111111111111111111111111,0x3333333333333333333333333333333333333333
          # Sampled navigation telemetry would add random beacons to the warm-request gate.
          NEXT_PUBLIC_HOME_INTERACTION_SAMPLE_RATE: "0"
        run: ./node_modules/.bin/next build

      - name: Start production fixture
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          HOME_PLAYWRIGHT_SMOKE: "1"
          HOME_OPERATOR_ADDRESSES: 0x1111111111111111111111111111111111111111,0x3333333333333333333333333333333333333333
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apps/web/performance-results"
          ./node_modules/.bin/next start --hostname 127.0.0.1 --port 3199 > "$GITHUB_WORKSPACE/apps/web/performance-results/server.log" 2>&1 &
          server_pid=$!
          echo "$server_pid" > "$GITHUB_WORKSPACE/apps/web/performance-results/server.pid"
          for attempt in {1..60}; do
            if curl --silent --fail http://localhost:3199/ > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          echo "Production fixture did not become ready" >&2
          tail -n 50 "$GITHUB_WORKSPACE/apps/web/performance-results/server.log" >&2
          exit 1

      # Structural gates block immediately; timing stays report-only during calibration.
      - name: Measure performance budgets
        id: budget
        shell: bash
        run: |
          set +e
          bun run --cwd apps/web perf:budget --base-url http://localhost:3199 --out-dir performance-results
          budget_status=$?
          echo "exit_code=$budget_status" >> "$GITHUB_OUTPUT"
          if [[ -f apps/web/performance-results/summary.md ]]; then
            cat apps/web/performance-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Performance budget produced no summary (exit $budget_status)." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Verify structural regression seeds
        shell: bash
        run: |
          set +e
          bun run --cwd apps/web perf:seeds --base-url http://localhost:3199 --out-dir performance-results/seeds
          seed_status=$?
          if [[ -f apps/web/performance-results/seeds/seeds.md ]]; then
            cat apps/web/performance-results/seeds/seeds.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Performance seeds produced no summary (exit $seed_status)." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$seed_status"

      - name: Verify CPU throttle restoration
        shell: bash
        run: |
          set +e
          bun run --cwd apps/web perf:cpu-check --base-url http://localhost:3199 --out-dir performance-results/cpu-check
          cpu_status=$?
          if [[ -f apps/web/performance-results/cpu-check/cpu-check.md ]]; then
            cat apps/web/performance-results/cpu-check/cpu-check.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CPU throttle self-check produced no summary (exit $cpu_status)." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$cpu_status"

      - name: Report performance trend
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          history="$RUNNER_TEMP/performance-history"
          mkdir -p "$history"
          run_ids=$(gh run list --workflow ci.yml --branch main --status completed --limit 21 --json databaseId --jq '.[].databaseId' || true)
          seen=0
          for run_id in $run_ids; do
            if [[ "$run_id" == "$GITHUB_RUN_ID" ]]; then
              continue
            fi
            seen=$((seen + 1))
            if (( seen > 20 )); then
              break
            fi
            run_dir="$history/$run_id"
            mkdir -p "$run_dir"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$run_dir/run-api.json" || true
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$run_dir/jobs-api.json" || true
            jq -n --argjson id "$run_id" --slurpfile info "$run_dir/run-api.json" --slurpfile jobs "$run_dir/jobs-api.json" '
              ($info[0] // {}) as $run |
              ([(($jobs[0].jobs // [])[]) | select(.name == "performance budgets")] | last // {}) as $job |
              {id: $id, headSha: $run.head_sha, createdAt: $run.created_at,
               runAttempt: $run.run_attempt, jobConclusion: $job.conclusion,
               jobStartedAt: $job.started_at, jobCompletedAt: $job.completed_at}
            ' > "$run_dir/run.json"
            gh run download "$run_id" -n performance-results -D "$run_dir" > /dev/null 2>&1 || true
          done
          node scripts/gates/performance-trend.mjs --current apps/web/performance-results/results.json --history "$history" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-results
          path: apps/web/performance-results
          retention-days: 90
          if-no-files-found: ignore

      - name: Stop production fixture
        if: always()
        shell: bash
        run: |
          if [[ -f apps/web/performance-results/server.pid ]]; then
            kill "$(cat apps/web/performance-results/server.pid)" 2>/dev/null || true
          fi

      - name: Enforce performance budgets
        if: always() && steps.budget.outputs.exit_code != ''
        env:
          BUDGET_EXIT: ${{ steps.budget.outputs.exit_code }}
        run: exit "$BUDGET_EXIT"

  # TODO(operator): rename this job to `repository gates` after the ruleset required check is updated.
  delivery-automation-tests:
    name: delivery automation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test repository gates
        run: bun run gates

  # Informational: the report script always exits 0, so a broken or empty
  # corpus can never fail this job. The markdown lands in the run summary.
  caught-by-report:
    name: caught-by report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Report fix provenance
        continue-on-error: true
        run: |
          if ! git rev-parse --verify "origin/${GITHUB_BASE_REF}" >/dev/null 2>&1; then
            git fetch --no-tags origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          fi
          node scripts/gates/caught-by-report.mjs --range "origin/${GITHUB_BASE_REF}..HEAD" | tee -a "$GITHUB_STEP_SUMMARY"

  postgres-store-contract:
    name: real PostgreSQL actions and funding contracts (PostgreSQL 14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: home_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d home_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/home_test
      OPERATOR_PG_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/home_test
      ACTION_PG_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/home_test
      FUNDING_PG_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/home_test
      BALANCES_PG_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/home_test
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Apply the Home database schema
        run: bun run --cwd apps/web db:migrate

      - name: Test actions, funding, balances, and operator stores against disposable PostgreSQL
        run: |
          tests=()
          while IFS= read -r -d '' file; do tests+=("$file"); done < <(git ls-files -z -- 'apps/web/**/*postgres*.test.ts')
          test "${#tests[@]}" -gt 0
          bun test "${tests[@]}"
