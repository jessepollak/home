name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: bun check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Non-secret defaults from .env.example. Browsing and the production
      # build work without CDP keys; live probes stay opt-in and are not set.
      DISABLE_CDP_USAGE_TRACKING: "true"
      DISABLE_CDP_ERROR_REPORTING: "true"
      CDP_SQL_AUTH_MODE: client-api-key
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verification evidence
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: node scripts/gates/verification-evidence.mjs

      - name: Playwright rung
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/gates/test-weight.mjs --check=rung 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Test weight
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/gates/test-weight.mjs --check=weight 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check
        run: bun check

      - name: Dead code (knip)
        run: bun run --cwd apps/web knip

      - name: Code Connect templates
        # Parses every *.figma.ts template offline; no Figma token is needed.
        run: bun run --cwd apps/web figma:connect:parse

      - name: Build Storybook
        run: bun run --cwd apps/web build-storybook

  # Main-only Figma sync. Both jobs skip their steps when the
  # FIGMA_ACCESS_TOKEN secret is absent, so the workflow never fails for lack
  # of it. Scopes: code_connect:write (publish), file_variables:read and
  # file_variables:write (variables). See docs/design-explorations/figma-workflow.md.
  publish-code-connect:
    name: publish Code Connect
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
    steps:
      - name: Skip without FIGMA_ACCESS_TOKEN
        if: env.FIGMA_ACCESS_TOKEN == ''
        run: echo "FIGMA_ACCESS_TOKEN is not set; skipping Code Connect publish."

      - name: Checkout
        if: env.FIGMA_ACCESS_TOKEN != ''
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        if: env.FIGMA_ACCESS_TOKEN != ''
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Setup Bun
        if: env.FIGMA_ACCESS_TOKEN != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install
        if: env.FIGMA_ACCESS_TOKEN != ''
        run: bun install --frozen-lockfile

      - name: Publish Code Connect
        if: env.FIGMA_ACCESS_TOKEN != ''
        run: bun run --cwd apps/web figma:connect:publish

  sync-figma-variables:
    name: sync Figma variables
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
    steps:
      - name: Skip without FIGMA_ACCESS_TOKEN
        if: env.FIGMA_ACCESS_TOKEN == ''
        run: echo "FIGMA_ACCESS_TOKEN is not set; skipping the Figma variables sync."

      - name: Checkout
        if: env.FIGMA_ACCESS_TOKEN != ''
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        if: env.FIGMA_ACCESS_TOKEN != ''
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Sync globals.css tokens to Figma variables
        if: env.FIGMA_ACCESS_TOKEN != ''
        run: node apps/web/scripts/figma-variables.mjs

  story-tests:
    name: story tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Chromium
        # Uses the pinned @playwright/test CLI so the vitest browser provider
        # finds the same browser build as the smoke suite.
        run: bun run --cwd apps/web test:browser-install

      - name: Test stories
        run: bun run --cwd apps/web test:stories

  browser-smoke:
    name: Chromium smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISABLE_CDP_USAGE_TRACKING: "true"
      DISABLE_CDP_ERROR_REPORTING: "true"
      CDP_SQL_AUTH_MODE: client-api-key
      HOME_PLAYWRIGHT_ACCESS_CREDENTIAL: chromium-smoke-access-credential-fixture
      HOME_PLAYWRIGHT_ACCESS_SIGNING_SECRET: chromium-smoke-signing-secret-fixture
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Chromium
        # Uses the pinned @playwright/test CLI; bare `bunx playwright` downloads the latest CLI and mismatched browser builds.
        run: bun run --cwd apps/web test:browser-install

      - name: Test Chromium smoke
        run: bun run --cwd apps/web test:browser-smoke

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-smoke-results
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  # TODO(operator): rename this job to `repository gates` after the ruleset required check is updated.
  delivery-automation-tests:
    name: delivery automation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test repository gates
        run: bun run gates

  # Informational: the report script always exits 0, so a broken or empty
  # corpus can never fail this job. The markdown lands in the run summary.
  caught-by-report:
    name: caught-by report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Report fix provenance
        continue-on-error: true
        run: |
          if ! git rev-parse --verify "origin/${GITHUB_BASE_REF}" >/dev/null 2>&1; then
            git fetch --no-tags origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          fi
          node scripts/gates/caught-by-report.mjs --range "origin/${GITHUB_BASE_REF}..HEAD" | tee -a "$GITHUB_STEP_SUMMARY"

  postgres-store-contract:
    name: real PostgreSQL actions and funding contracts (PostgreSQL 14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: home_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d home_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/home_test
      OPERATOR_PG_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/home_test
      ACTION_PG_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/home_test
      FUNDING_PG_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/home_test
      BALANCES_PG_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/home_test
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Apply the Home database schema
        run: bun run --cwd apps/web db:migrate

      - name: Test actions, funding, balances, identity, and operator stores against disposable PostgreSQL
        run: bun test apps/web/server/operator-settings/store.postgres.test.ts apps/web/server/customers/resolve.postgres.test.ts apps/web/server/actions/store.postgres.test.ts apps/web/server/actions/outcomes.postgres.test.ts apps/web/server/actions/store.cashout.postgres.test.ts apps/web/server/funding/core/postgres-store.integration.test.ts apps/web/server/funding/core/customer-postgres-store.integration.test.ts apps/web/server/funding/core/user-token-postgres-store.integration.test.ts apps/web/server/balances/postgres-snapshot-store.test.ts apps/web/server/balances/postgres-webhook-subscription-store.test.ts apps/web/server/balances/postgres-price-observation-store.test.ts apps/web/server/identity/store.integration.test.ts
