name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static-checks:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Non-secret defaults from .env.example. Browsing and the production
      # build work without CDP keys; live probes stay opt-in and are not set.
      DISABLE_CDP_USAGE_TRACKING: "true"
      DISABLE_CDP_ERROR_REPORTING: "true"
      CDP_SQL_AUTH_MODE: client-api-key
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verification evidence
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: node scripts/gates/verification-evidence.mjs

      - name: Playwright rung
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/gates/playwright-rung.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Failure cases
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/gates/failure-cases.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: SQL performance evidence
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: node scripts/gates/sql-performance.mjs

      - name: Gates
        env:
          BASE_REF: ${{ github.base_ref || github.event.before }}
        run: bun run gates

      - name: Static checks
        run: bun run check:static

      - name: Dead code (knip)
        run: bun run --cwd apps/web knip

      - name: Build Storybook
        run: bun run --cwd apps/web build-storybook

  unit-tests:
    name: unit tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [server, client]
    env:
      DISABLE_CDP_USAGE_TRACKING: "true"
      DISABLE_CDP_ERROR_REPORTING: "true"
      CDP_SQL_AUTH_MODE: client-api-key
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: node scripts/gates/unit-test-shards.mjs run ${{ matrix.shard }}
      - name: Unit-test file order
        if: matrix.shard == 'client'
        run: node scripts/gates/unit-test-file-order.mjs client

      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-results-${{ matrix.shard }}
          path: apps/web/unit-test-results
          retention-days: 30
          if-no-files-found: ignore

  check:
    name: bun check
    needs: [static-checks, unit-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Download unit-test results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: unit-test-results-*
          path: ${{ runner.temp }}/unit-test-results

      - name: Unit-test coverage
        id: coverage
        if: always()
        shell: bash
        run: |
          set -o pipefail
          if [[ -f "$RUNNER_TEMP/unit-test-results/unit-test-results-server/junit.xml" || -f "$RUNNER_TEMP/unit-test-results/unit-test-results-client/junit.xml" ]]; then
            echo "junit_present=true" >> "$GITHUB_OUTPUT"
          fi
          node scripts/gates/unit-test-shards.mjs verify \
            --junit server="$RUNNER_TEMP/unit-test-results/unit-test-results-server/junit.xml" \
            --junit client="$RUNNER_TEMP/unit-test-results/unit-test-results-client/junit.xml" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Unit-test runtime
        if: ${{ !cancelled() && steps.coverage.outputs.junit_present == 'true' }}
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/gates/test-runtime.mjs \
            --junit "$RUNNER_TEMP/unit-test-results/unit-test-results-server/junit.xml" \
            --junit "$RUNNER_TEMP/unit-test-results/unit-test-results-client/junit.xml" \
            --summary-json "$RUNNER_TEMP/unit-test-results/runtime.json" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload unit-test timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-timings
          path: ${{ runner.temp }}/unit-test-results
          retention-days: 30
          if-no-files-found: ignore

      - name: Enforce checks
        if: always()
        env:
          STATIC_RESULT: ${{ needs.static-checks.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
        run: test "$STATIC_RESULT" = success && test "$UNIT_RESULT" = success

  story-tests:
    name: story tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Chromium
        # Uses the pinned @playwright/test CLI so the vitest browser provider
        # finds the same browser build as the smoke suite.
        run: bun run --cwd apps/web test:browser-install

      - name: Test stories
        run: bun run --cwd apps/web test:stories

  exploration-story-tests:
    name: exploration story tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bun run --cwd apps/web test:browser-install

      - name: Test exploration stories
        run: bun run --cwd apps/web test:stories:explorations

  browser-smoke:
    name: Chromium smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISABLE_CDP_USAGE_TRACKING: "true"
      DISABLE_CDP_ERROR_REPORTING: "true"
      CDP_SQL_AUTH_MODE: client-api-key
      HOME_PLAYWRIGHT_ACCESS_CREDENTIAL: chromium-smoke-access-credential-fixture
      HOME_PLAYWRIGHT_ACCESS_SIGNING_SECRET: chromium-smoke-signing-secret-fixture
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Chromium
        # Uses the pinned @playwright/test CLI; bare `bunx playwright` downloads the latest CLI and mismatched browser builds.
        run: bun run --cwd apps/web test:browser-install

      - name: Test Chromium smoke
        run: bun run --cwd apps/web test:browser-smoke

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-smoke-results
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  # TODO(operator): rename this job to `repository gates` after the ruleset required check is updated.
  delivery-automation-tests:
    name: delivery automation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_REF: ${{ github.base_ref || 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test repository gates
        run: bun run gates

  # Informational: the report script always exits 0, so a broken or empty
  # corpus can never fail this job. The markdown lands in the run summary.
  caught-by-report:
    name: caught-by report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Report fix provenance
        continue-on-error: true
        run: |
          if ! git rev-parse --verify "origin/${GITHUB_BASE_REF}" >/dev/null 2>&1; then
            git fetch --no-tags origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          fi
          node scripts/gates/caught-by-report.mjs --range "origin/${GITHUB_BASE_REF}..HEAD" | tee -a "$GITHUB_STEP_SUMMARY"

  postgres-store-contract:
    name: real PostgreSQL actions and funding contracts (PostgreSQL 14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: home_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d home_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/home_test
      OPERATOR_PG_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/home_test
      ACTION_PG_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/home_test
      FUNDING_PG_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/home_test
      BALANCES_PG_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/home_test
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Apply the Home database schema
        run: bun run --cwd apps/web db:migrate

      - name: Test actions, funding, balances, and operator stores against disposable PostgreSQL
        run: |
          tests=()
          while IFS= read -r -d '' file; do tests+=("$file"); done < <(git ls-files -z -- 'apps/web/**/*postgres*.test.ts')
          test "${#tests[@]}" -gt 0
          bun test "${tests[@]}"
