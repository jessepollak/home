# Keeps room for new Vercel previews under Neon Free's 10-total-branch project
# cap. The Neon integration is required, so a new git branch's deployment can
# fail with “Resource provisioning failed” if the project is full.
#
# Each run deletes stale eligible preview/* branches first (no open PR and at
# least one closed or merged PR), then the oldest remaining previews until the
# total project branch count reaches cap minus headroom. Default headroom is four
# slots: main + five previews = six total, leaving four slots free. Only
# preview/* branches are deleted; default, protected and other branches are safe.
# If too few previews can be deleted, report reduced headroom or fail when full.
#
# Runs on every non-main push, alongside (not before) that push's Vercel
# deploy, so headroom is restored for the next new branch; GitHub throttles
# the schedule to hours apart, so the cron is only a backstop.
#
# Assumptions (see docs/vercel-deploy.md):
# - Vercel-Managed and Neon-Managed integrations name preview DBs
#   preview/<git-branch> (https://neon.com/docs/guides/vercel-branch-cleanup).
# - Only those names are eligible. Other branches count toward the cap but
#   are never deleted.
# - Oldest-first can delete a still-open older PR's preview DB when needed;
#   PR-close cleanup is the primary path.
#
# Uses the Neon HTTP API (same surface as neon/neonctl). No-op when
# credentials are missing so forks without Neon stay green.

name: Prune Neon preview branches

on:
  schedule:
    # Backstop only; GitHub runs this far less often than every 15 minutes.
    - cron: "*/15 * * * *"
  push:
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      headroom:
        description: "Free slots to leave under the 10-branch project cap (default 4)"
        type: string
        default: "4"
      dry_run:
        description: "List deletions without calling DELETE"
        type: boolean
        default: false

concurrency:
  group: neon-preview-prune-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  prune:
    name: Prune stale preview/* and restore project headroom
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID || secrets.NEON_PROJECT_ID }}
      NEON_BRANCH_CAP: "10"
      PREVIEW_HEADROOM: ${{ github.event.inputs.headroom || '4' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require Neon credentials
        id: creds
        run: |
          if [ -z "${NEON_API_KEY}" ] || [ -z "${NEON_PROJECT_ID}" ]; then
            echo "Skipping Neon preview prune: set repository secret NEON_API_KEY and variable NEON_PROJECT_ID (see docs/vercel-deploy.md)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.creds.outputs.configured == 'true'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        if: steps.creds.outputs.configured == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: List preview branches and prune oldest
        if: steps.creds.outputs.configured == 'true'
        run: |
          set -euo pipefail

          if ! [[ "${NEON_BRANCH_CAP}" =~ ^[1-9][0-9]*$ ]] || ! [[ "${PREVIEW_HEADROOM}" =~ ^[1-9][0-9]*$ ]]; then
            echo "NEON_BRANCH_CAP and PREVIEW_HEADROOM must be positive integers"
            exit 1
          fi

          # Paginate GET /projects/{id}/branches (Neon API v2).
          pages='[]'
          cursor=""
          while true; do
            url="https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches?limit=100&sort_by=created_at&sort_order=asc"
            if [ -n "$cursor" ]; then
              url="${url}&cursor=$(jq -rn --arg c "$cursor" '$c|@uri')"
            fi
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' \
              -H "Accept: application/json" \
              -H "Authorization: Bearer ${NEON_API_KEY}" \
              "$url")"
            if [ "$code" != "200" ]; then
              echo "Neon list branches failed: HTTP $code"
              cat "$tmp"
              exit 1
            fi
            pages="$(jq -n --argjson acc "$pages" --argjson page "$(cat "$tmp")" '$acc + [$page]')"
            cursor="$(jq -r '.pagination.next // empty' "$tmp")"
            rm -f "$tmp"
            [ -z "$cursor" ] && break
          done
          all="$(node scripts/ci/neon-preview-prune-plan.mjs collect <<<"$pages")"

          echo "Total branches in project: $(jq 'length' <<<"$all")"
          echo "All branch names:"
          jq -r '.[] | "- \(.name) (\(.id), created \(.created_at), default=\(.default), protected=\(.protected))"' <<<"$all"

          preview="$(node scripts/ci/neon-preview-prune-plan.mjs eligible <<<"$all")"

          # Stale = no open PR for the git branch and at least one closed or
          # merged PR. Branches without a PR yet are never stale; lookup errors
          # count as not stale.
          stale='[]'
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            ref="${name#preview/}"
            open="$(gh pr list --head "$ref" --state open --limit 1 --json number --jq 'length')" || open=""
            [ "$open" = "0" ] || continue
            any="$(gh pr list --head "$ref" --state all --limit 1 --json number --jq 'length')" || any=""
            if [ "$any" = "1" ]; then
              stale="$(jq -c --arg n "$name" '. + [$n]' <<<"$stale")"
            fi
          done < <(jq -r '.[].name' <<<"$preview")

          result="$(node scripts/ci/neon-preview-prune-plan.mjs plan --cap "$NEON_BRANCH_CAP" --headroom "$PREVIEW_HEADROOM" --stale "$stale" <<<"$all")"
          total="$(jq -r '.total' <<<"$result")"
          target="$(jq -r '.target' <<<"$result")"
          after="$(jq -r '.after' <<<"$result")"
          status="$(jq -r '.status' <<<"$result")"
          plan="$(jq -c '.plan' <<<"$result")"
          echo "Project branches: total ${total}, cap ${NEON_BRANCH_CAP}, headroom ${PREVIEW_HEADROOM}, target ${target}"
          echo "Eligible preview/* branches: $(jq 'length' <<<"$preview")"
          jq -r '.[] | "- \(.name) (\(.id), created \(.created_at))"' <<<"$preview"
          echo "Stale (no open PR; closed or merged): $(jq -r 'if length == 0 then "none" else join(", ") end' <<<"$stale")"
          if [ "$total" -ge "$NEON_BRANCH_CAP" ]; then
            echo "::warning::Project was at the Neon branch cap before pruning (total ${total}, cap ${NEON_BRANCH_CAP})."
          fi

          to_delete="$(jq 'length' <<<"$plan")"
          echo "Plan: ${to_delete} preview/* branch(es), stale first, then oldest; projected total after pruning: ${after}."
          jq -r '.[] | "- \(.name) (\(.id), created \(.created_at))"' <<<"$plan"
          if [ "$to_delete" -eq 0 ] && [ "$status" = "ok" ]; then
            echo "No stale previews and project total is within target; no-op."
          fi

          mapfile -t rows < <(jq -c '.[]' <<<"$plan")
          for row in "${rows[@]}"; do
            id="$(jq -r '.id' <<<"$row")"
            name="$(jq -r '.name' <<<"$row")"
            created="$(jq -r '.created_at' <<<"$row")"

            ref="${name#preview/}"
            ref="${ref,,}"
            if [[ "$name" != preview/* ]] || [[ "$ref" == "main" || "$ref" == "production" || "$ref" == "prod" ]] || [ "$id" = "null" ] || [ -z "$id" ]; then
              echo "Refusing to delete unexpected row: ${row}"
              exit 1
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "dry_run: would delete ${name} (${id}, created ${created})"
              continue
            fi

            echo "Deleting ${name} (${id}, created ${created})"
            del="$(mktemp)"
            dcode="$(curl -sS -o "$del" -w '%{http_code}' -X DELETE \
              -H "Accept: application/json" \
              -H "Authorization: Bearer ${NEON_API_KEY}" \
              "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${id}")"
            # 200 = deleted; 404 = already gone (idempotent).
            if [ "$dcode" != "200" ] && [ "$dcode" != "404" ]; then
              echo "Neon delete branch failed: HTTP $dcode"
              cat "$del"
              rm -f "$del"
              exit 1
            fi
            echo "Delete ${name}: HTTP $dcode"
            rm -f "$del"
          done

          noneligible="$(jq -r --argjson preview "$preview" 'map(.name) - ($preview | map(.name)) | if length == 0 then "none" else join(", ") end' <<<"$all")"
          if [ "$status" = "short" ]; then
            echo "::warning::Projected total after pruning ${after} exceeds target ${target}; at least one slot is free under cap ${NEON_BRANCH_CAP}, but branches the prune never deletes (non-preview, default or protected) fill the rest: ${noneligible}."
          elif [ "$status" = "full" ]; then
            echo "::error::Project is at the Neon cap (${NEON_BRANCH_CAP}); no preview/* branches left to delete. The next preview deployment will fail. Non-eligible branches: ${noneligible}."
            exit 1
          fi
          echo "Prune finished."
