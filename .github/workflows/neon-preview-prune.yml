# Keeps Neon Free’s 10-branch project cap from blocking Vercel previews. The
# Neon integration is a required preview deployment step, so a new git branch
# fails with “Resource provisioning failed” when the project is full.
#
# Each run first deletes stale previews: preview/<ref> whose git branch has
# only closed or merged PRs (a push after merge recreates the DB after
# PR-close cleanup ran). Then, if preview/* count is >= 6 (the exclusive
# keep_below threshold), it deletes the oldest remaining previews until count
# is < 6, so main + five previews = six total leaves four slots free.
# Never deletes main / production / default / protected / non-preview branches.
#
# Runs on every non-main push, alongside (not before) that push's Vercel
# deploy, so headroom is restored for the next new branch; GitHub throttles
# the schedule to hours apart, so the cron is only a backstop.
#
# Assumptions (see docs/vercel-deploy.md):
# - Vercel-Managed and Neon-Managed integrations name preview DBs
#   preview/<git-branch> (https://neon.com/docs/guides/vercel-branch-cleanup).
# - Only those names are eligible. Other branches are left alone.
# - Oldest-first can delete the preview DB of a still-open older PR once six
#   preview branches exist; PR-close cleanup is the primary path.
#
# Uses the Neon HTTP API (same surface as neon/neonctl). No-op when
# credentials are missing so forks without Neon stay green.

name: Prune Neon preview branches

on:
  schedule:
    # Backstop only; GitHub runs this far less often than every 15 minutes.
    - cron: "*/15 * * * *"
  push:
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      keep_below:
        description: "Exclusive threshold: delete oldest preview/* until count is below this (6 keeps the newest five)"
        type: string
        default: "6"
      dry_run:
        description: "List deletions without calling DELETE"
        type: boolean
        default: false

concurrency:
  group: neon-preview-prune-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  prune:
    name: Prune stale preview/* and keep newest five
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID || secrets.NEON_PROJECT_ID }}
      PREVIEW_KEEP_BELOW: ${{ github.event.inputs.keep_below || '6' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require Neon credentials
        id: creds
        run: |
          if [ -z "${NEON_API_KEY}" ] || [ -z "${NEON_PROJECT_ID}" ]; then
            echo "Skipping Neon preview prune: set repository secret NEON_API_KEY and variable NEON_PROJECT_ID (see docs/vercel-deploy.md)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: List preview branches and prune oldest
        if: steps.creds.outputs.configured == 'true'
        run: |
          set -euo pipefail

          if ! [[ "${PREVIEW_KEEP_BELOW}" =~ ^[1-9][0-9]*$ ]]; then
            echo "PREVIEW_KEEP_BELOW must be a positive integer, got: ${PREVIEW_KEEP_BELOW}"
            exit 1
          fi

          # Paginate GET /projects/{id}/branches (Neon API v2).
          all='[]'
          cursor=""
          while true; do
            url="https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches?limit=100&sort_by=created_at&sort_order=asc"
            if [ -n "$cursor" ]; then
              url="${url}&cursor=$(jq -rn --arg c "$cursor" '$c|@uri')"
            fi
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' \
              -H "Accept: application/json" \
              -H "Authorization: Bearer ${NEON_API_KEY}" \
              "$url")"
            if [ "$code" != "200" ]; then
              echo "Neon list branches failed: HTTP $code"
              cat "$tmp"
              exit 1
            fi
            all="$(jq -n --argjson acc "$all" --argjson page "$(cat "$tmp")" '$acc + ($page.branches // [])')"
            cursor="$(jq -r '.pagination.next // empty' "$tmp")"
            rm -f "$tmp"
            [ -z "$cursor" ] && break
          done

          echo "Total branches in project: $(jq 'length' <<<"$all")"
          echo "All branch names:"
          jq -r '.[] | "- \(.name) (\(.id), created \(.created_at), default=\(.default), protected=\(.protected))"' <<<"$all"

          # Eligible = preview/* only. Belt-and-suspenders skip for
          # default/protected and production-like names.
          preview="$(jq -c '
            [.[]
              | select(.name | startswith("preview/"))
              | select((.name | ascii_downcase) != "main")
              | select((.name | ascii_downcase) != "production")
              | select((.name | ascii_downcase) != "prod")
              | select(.default != true)
              | select(.protected != true)
            ] | sort_by(.created_at)
          ' <<<"$all")"

          # Stale = no open PR for the git branch and at least one closed or
          # merged PR. Branches without a PR yet are never stale; lookup errors
          # count as not stale.
          stale='[]'
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            ref="${name#preview/}"
            open="$(gh pr list --head "$ref" --state open --limit 1 --json number --jq 'length')" || open=""
            [ "$open" = "0" ] || continue
            any="$(gh pr list --head "$ref" --state all --limit 1 --json number --jq 'length')" || any=""
            if [ "$any" = "1" ]; then
              stale="$(jq -c --arg n "$name" '. + [$n]' <<<"$stale")"
            fi
          done < <(jq -r '.[].name' <<<"$preview")

          count="$(jq 'length' <<<"$preview")"
          echo "Deletable preview/* count: ${count} (exclusive keep_below ${PREVIEW_KEEP_BELOW}; keep newest $((PREVIEW_KEEP_BELOW - 1)))"
          jq -r '.[] | "- \(.name) (\(.id), created \(.created_at))"' <<<"$preview"
          echo "Stale (no open PR; closed or merged): $(jq -r 'if length == 0 then "none" else join(", ") end' <<<"$stale")"

          # Stale previews first, then the oldest open ones until below threshold.
          plan="$(jq -c --argjson stale "$stale" --argjson keep "$PREVIEW_KEEP_BELOW" '
            map(select(.name as $n | any($stale[]; . == $n))) as $s
            | map(select(.name as $n | any($stale[]; . == $n) | not)) as $rest
            | (($rest | length) - $keep + 1) as $extra
            | $s + $rest[0:(if $extra > 0 then $extra else 0 end)]
          ' <<<"$preview")"

          to_delete="$(jq 'length' <<<"$plan")"
          if [ "$to_delete" -eq 0 ]; then
            echo "No stale previews and count is below ${PREVIEW_KEEP_BELOW}; no-op."
            exit 0
          fi

          echo "Deleting ${to_delete} preview/* branch(es): stale first, then oldest, to leave count < ${PREVIEW_KEEP_BELOW}."

          mapfile -t rows < <(jq -c '.[]' <<<"$plan")
          for row in "${rows[@]}"; do
            id="$(jq -r '.id' <<<"$row")"
            name="$(jq -r '.name' <<<"$row")"
            created="$(jq -r '.created_at' <<<"$row")"

            if [[ "$name" != preview/* ]] || [ "$id" = "null" ] || [ -z "$id" ]; then
              echo "Refusing to delete unexpected row: ${row}"
              exit 1
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "dry_run: would delete ${name} (${id}, created ${created})"
              continue
            fi

            echo "Deleting ${name} (${id}, created ${created})"
            del="$(mktemp)"
            dcode="$(curl -sS -o "$del" -w '%{http_code}' -X DELETE \
              -H "Accept: application/json" \
              -H "Authorization: Bearer ${NEON_API_KEY}" \
              "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${id}")"
            # 200 = deleted; 404 = already gone (idempotent).
            if [ "$dcode" != "200" ] && [ "$dcode" != "404" ]; then
              echo "Neon delete branch failed: HTTP $dcode"
              cat "$del"
              rm -f "$del"
              exit 1
            fi
            echo "Delete ${name}: HTTP $dcode"
            rm -f "$del"
          done

          echo "Prune finished."
